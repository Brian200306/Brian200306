<svg xmlns="http://www.w3.org/2000/svg" width="360" height="124" viewBox="0 0 360 124" role="img" aria-labelledby="title desc">
<title id="title">Brian Victor — ERP, APIs and automation · Games</title>
<desc id="desc">Brian Victor stays static over an animated blue, cyan and teal background with amber accents. A static version is used for reduced motion.</desc>
<defs>
  <clipPath id="frame"><rect x=".5" y=".5" width="359" height="123" rx="4"/></clipPath>
  <linearGradient id="base" x2="1" y2=".25"><stop stop-color="#0c2139"/><stop offset=".48" stop-color="#102536"/><stop offset="1" stop-color="#073642"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#225ae4"/><stop offset=".6" stop-color="#167ebf"/><stop offset="1" stop-color="#18c0d3"/></linearGradient>
  <linearGradient id="teal" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#20bfa0"/><stop offset=".55" stop-color="#148c9f"/><stop offset="1" stop-color="#1855a6"/></linearGradient>
  <linearGradient id="readability"><stop stop-color="#071b2a" stop-opacity="0"/><stop offset=".36" stop-color="#071b2a" stop-opacity=".22"/><stop offset=".62" stop-color="#071b2a" stop-opacity=".42"/><stop offset="1" stop-color="#071b2a" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .background-blue{animation:blue-shift 10s ease-in-out infinite alternate}
  .background-teal{animation:teal-shift 13s ease-in-out infinite alternate}
  .background-amber{animation:amber-shift 9s ease-in-out infinite alternate}
  @keyframes blue-shift{from{transform:translate(0,0)}to{transform:translate(30.6px,-7px)}}
  @keyframes teal-shift{from{transform:translate(0,0)}to{transform:translate(-32.4px,5px)}}
  @keyframes amber-shift{from{transform:translateX(0)}to{transform:translateX(-19.8px)}}
  @media(prefers-reduced-motion:reduce){.background-blue,.background-teal,.background-amber{animation:none!important}}
</style>
<rect width="360" height="124" fill="#0d1117"/>
<g id="animated-background" clip-path="url(#frame)">
  <rect width="360" height="124" fill="url(#base)"/>
  <g class="background-blue" opacity=".72">
    <path d="M-130 -24H144.0L64.8 148H-130Z" fill="url(#blue)"/>
    <path d="M144.0 -24L64.8 148" fill="none" stroke="#72d8f4" stroke-width="1" opacity=".55"/>
    <path d="M108.0 -24L28.8 148" fill="none" stroke="#89c6fa" stroke-width=".65" opacity=".20"/>
  </g>
  <g class="background-teal" opacity=".67">
    <path d="M266.4 -24H490V148H190.8Z" fill="url(#teal)"/>
    <path d="M266.4 -24L190.8 148" fill="none" stroke="#70e3ce" stroke-width="1" opacity=".43"/>
  </g>
  <g class="background-amber">
    <path d="M327.6 -24H342.0L262.8 148H248.4Z" fill="#efaa59" opacity=".13"/>
    <path d="M327.6 -24L248.4 148" fill="none" stroke="#efbd79" stroke-width="1.1" opacity=".58"/>
  </g>
  <rect width="360" height="124" fill="url(#readability)"/>
</g>
<rect x=".5" y=".5" width="359" height="123" rx="4" fill="none" stroke="#294454" stroke-width=".8"/>
<text id="display-name" x="180.0" y="51" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" letter-spacing="-.8" fill="#f5f9fc">Brian Victor</text>
<text id="role-line" x="180.0" y="79" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#d4e2ee">ERP, APIs and automation · Games</text>
</svg>